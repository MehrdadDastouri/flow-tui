[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-tui"
version = "0.1.0"
description = "A terminal UI for real-time order flow imbalance and microstructural telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mehrdad Dastouri", email = "s.dastouri@alumni.sbu.ac.ir" },
]
dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
flow-tui = "flow_tui.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"
